<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Wide World Importers</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="login-pagina">
    <form class="login-caja" id="form-login" autocomplete="off">
      <h1>Wide World Importers</h1>
      <p class="login-sub">Inicie sesión para continuar</p>

      <label for="username">Usuario</label>
      <input type="text" id="username" required autofocus>

      <label for="password">Contraseña</label>
      <input type="password" id="password" required>

      <button type="submit" id="btn-ingresar">Ingresar</button>

      <div class="login-error" id="login-error" hidden></div>

      <div class="login-ayuda">
        Administrador de sucursal: <strong>admin_sj</strong> o <strong>admin_limon</strong><br>
        Corporativo: <strong>corp</strong>
      </div>
    </form>
  </main>

  <script>window.PAGINA_PUBLICA = true;</script>
  <script src="js/api.js"></script>
  <script>
    // Si ya hay sesión iniciada, no se vuelve a pedir el login
    if (getSesion()) window.location.replace('index.html');

    const form = document.getElementById('form-login');
    const errorCaja = document.getElementById('login-error');
    const boton = document.getElementById('btn-ingresar');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorCaja.hidden = true;
      boton.disabled = true;
      boton.textContent = 'Ingresando...';

      try {
        const res = await fetch(API_URL + '/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'No se pudo iniciar sesión');

        guardarSesion(data);
        window.location.replace('index.html');
      } catch (err) {
        const sinConexion = err instanceof TypeError;
        errorCaja.textContent = sinConexion
          ? 'No se pudo conectar con la API. ¿Está corriendo en el puerto 4000?'
          : err.message;
        errorCaja.hidden = false;
        boton.disabled = false;
        boton.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
